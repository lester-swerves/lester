<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DE LA CRUZ — Personal Digital Space</title>
<meta name="description" content="DE LA CRUZ — an intern at lccb, and currently learning web developing.">
<meta property="og:title" content="DE LA CRUZ">
<meta property="og:description" content="Personal · Creative · Digital">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og-image.png"><!-- add your image -->
<meta name="theme-color" content="#050505">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzA1MDUwNSIvPjxwYXRoIGQ9Ik05IDhoN2E4IDggMCAwMTAgMTZIOXoiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzIyQzU1RSIgc3Ryb2tlLXdpZHRoPSIzIi8+PC9zdmc+Cg==" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js" defer></script>
<style>
/* DE LA CRUZ — black × green. Edit colours in :root. */
:root{--black:#050505;--black-soft:#0A0A0A;--dark:#0D120F;--surface:#111713;--surface-light:#172019;
--green-dark:#276416;--green:#35a620;--green-main:#78e23a;--green-light:#33ff00;--green-neon:#54fd3e;
--white:#F5F5F5;--gray:#A1A1AA;--gray-dark:#52525B;--line:rgba(34,197,94,.18);
--font:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px;-webkit-text-size-adjust:100%}
body{background:var(--black);color:var(--white);font:400 1.05rem/1.7 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%}
a{color:inherit;text-decoration:none}ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--green-neon);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--green-main);color:#000;padding:.6rem 1rem;z-index:99}.skip:focus{left:0}
.wrap{width:min(1200px,90%);margin:0 auto}.narrow{width:min(760px,90%)}
.two{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(2rem,6vw,6rem);align-items:center}
h2{font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;font-weight:700;letter-spacing:-.02em;margin-bottom:1.5rem}
h3{font-weight:500;font-size:1.25rem}
p{color:var(--gray);max-width:62ch;margin-bottom:1rem}
.label{color:var(--green-main);font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:.8rem}
.sec{padding:clamp(5rem,12vw,9rem) 0}.alt{background:var(--black-soft);border-block:1px solid var(--line)}

/* nav */
.nav{position:fixed;inset:0 0 auto;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 5%;transition:transform .4s var(--ease),background .4s,padding .4s,border-color .4s;border-bottom:1px solid transparent}
.nav.stuck{background:rgba(5,5,5,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-block:.7rem;border-color:var(--line)}
.nav.hide{transform:translateY(-100%)}
.logo{font-weight:700;letter-spacing:.22em;font-size:1.05rem}
.logo-img{width:clamp(70px,10vw,110px);height:auto;display:block}
.nav nav{display:flex;gap:2rem}
.nav nav a{position:relative;font-size:.9rem;color:var(--gray);transition:color .3s;padding:.3rem 0}
.nav nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--green-main);transform:scaleX(0);transform-origin:right;transition:transform .4s var(--ease)}
.nav nav a:hover,.nav nav a.on{color:var(--white)}.nav nav a:hover::after,.nav nav a.on::after{transform:scaleX(1);transform-origin:left}
.burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer;position:relative}
.burger span{position:absolute;left:10px;right:10px;height:2px;background:var(--white);transition:.3s}
.burger span:first-child{top:17px}.burger span:last-child{top:25px}
.burger[aria-expanded=true] span:first-child{top:21px;transform:rotate(45deg)}.burger[aria-expanded=true] span:last-child{top:21px;transform:rotate(-45deg)}

/* hero: banner fills the screen on any device */
.hero{
  position:relative;
  width:100%;
  height:100vh;            /* fallback for older browsers */
  height:100svh;           /* mobile-safe: ignores the collapsing address bar */
  min-height:480px;        /* never squashed on short / landscape screens */
  overflow:hidden;
  background:var(--black) url("image/banner1.jpg") center center / cover no-repeat;
  display:grid;
  place-items:center;
}
#particles-js{position:absolute;inset:0;z-index:0;pointer-events:none}
#particles-js canvas{display:block;width:100%;height:100%}
.hero-content{
  position:relative;
  z-index:1;
  text-align:center;
  color:#fff;
  width:min(1200px,100%);
  padding:clamp(5rem,12vh,9rem) 5% 2rem;   /* clears the fixed navbar, scales with screen */
}

/* about */
.ph{aspect-ratio:4/5;background:linear-gradient(160deg,var(--surface-light),var(--black-soft));display:grid;place-items:center;font-size:4rem;font-weight:700;color:var(--green-dark);letter-spacing:.1em;position:relative;border:1px solid var(--line)}
.ph::before{content:"";position:absolute;inset:18px -18px -18px 18px;border:1px solid var(--green-main);z-index:-1}
.photo{position:relative;z-index:0;padding:0 18px 18px 0}.photo img{width:100%;display:block}
.facts{margin:1.5rem 0;border-top:1px solid var(--line)}
.facts div{display:flex;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--line)}
.facts dt{width:8.5rem;color:var(--green-main);font-size:.9rem;flex:none}.facts dd{color:var(--white)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.stats div{background:var(--surface);border:1px solid var(--line);padding:1.2rem}
.stats b{display:block;font-size:2.2rem;color:var(--green-light);line-height:1.1}.stats span{color:var(--gray);font-size:.85rem}

.btn{display:inline-block;padding:.95rem 1.7rem;border:1px solid var(--green-main);color:var(--green-light);font:500 .85rem var(--font);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;background:transparent;transition:.35s var(--ease)}
.btn:hover{box-shadow:0 0 28px rgba(34,197,94,.35);transform:translateY(-3px);color:var(--white)}
.btn.solid{background:var(--green-main);color:#031007}.btn.solid:hover{background:var(--green-neon);color:#031007}

/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:2.5rem 2rem;margin-top:3rem}
.pimg{display:block;aspect-ratio:16/10;position:relative;overflow:hidden;margin-bottom:1.2rem;background:linear-gradient(135deg,var(--surface-light),var(--dark));border:1px solid var(--line)}
.pimg span{position:absolute;inset:0;display:grid;place-items:center;font-size:5rem;font-weight:700;color:var(--green-dark);transition:transform .7s var(--ease)}
.pimg::after{content:"View";position:absolute;inset:0;display:grid;place-items:center;background:rgba(22,163,74,.82);color:#031007;font-weight:500;letter-spacing:.2em;text-transform:uppercase;opacity:0;transition:opacity .4s}
.pimg:hover span,.pimg:focus-visible span{transform:scale(1.12)}.pimg:hover::after,.pimg:focus-visible::after{opacity:1}
.proj h3{margin-bottom:.4rem}.tags{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 1rem}
.tags li{font-size:.75rem;color:var(--green-light);border:1px solid var(--line);padding:.2rem .7rem;border-radius:99px}
.link{color:var(--green-main);border-bottom:1px solid transparent;transition:.3s}.link:hover{border-color:var(--green-main);padding-bottom:2px}

/* timeline */
.timeline{position:relative;margin-top:3rem;padding-left:2.5rem}
.timeline::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(var(--green-main),transparent)}
.timeline li{position:relative;padding-bottom:3rem}
.timeline li::before{content:"";position:absolute;left:-2.5rem;top:.5rem;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:var(--green-neon);box-shadow:0 0 0 5px rgba(57,255,136,.15),0 0 16px var(--green-neon)}
.timeline time{color:var(--green-main);font-size:.9rem;letter-spacing:.1em}.timeline h3{margin:.2rem 0 .4rem;font-size:1.6rem}

/* contact */
.contact{background:radial-gradient(50% 60% at 15% 50%,rgba(6,78,59,.4),transparent),var(--black)}
.big{font-size:clamp(2.4rem,6vw,4.8rem)}.g{color:var(--green-main);display:block}
.social{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;margin-top:1.5rem}
.social a{color:var(--gray);border-bottom:1px solid var(--line);transition:.3s}.social a:hover{color:var(--green-neon);border-color:var(--green-neon)}
.form{background:rgba(17,23,19,.7);backdrop-filter:blur(10px);border:1px solid var(--line);padding:clamp(1.5rem,4vw,2.5rem);display:grid;gap:1.2rem}
.form label{display:grid;gap:.4rem;font-size:.85rem;color:var(--gray)}
.form input,.form textarea{background:var(--black);border:1px solid var(--gray-dark);color:var(--white);font:inherit;padding:.85rem 1rem;transition:border-color .3s,box-shadow .3s;width:100%}
.form input:focus,.form textarea:focus{outline:0;border-color:var(--green-main);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.form input:user-invalid,.form textarea:user-invalid{border-color:#f87171}
.status{margin:0;min-height:1.5em;color:var(--green-light)}

/* footer */
.foot{position:relative;border-top:1px solid var(--line);padding:4rem 0 2rem;overflow:hidden}
.foot-big{font-size:clamp(3rem,13vw,12rem);font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--surface-light);text-align:center;margin:0 0 2rem;max-width:none}
.foot-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;color:var(--gray);font-size:.85rem}.foot-row .social{margin:0}
.top{position:fixed;right:1.5rem;bottom:1.5rem;width:46px;height:46px;display:grid;place-items:center;border:1px solid var(--green-main);background:var(--black);color:var(--green-main);opacity:0;pointer-events:none;transform:translateY(16px);transition:.4s var(--ease);z-index:40}
.top.show{opacity:1;pointer-events:auto;transform:none}.top:hover{background:var(--green-main);color:#000;transform:translateY(-4px)}

/* reveal */
.js .rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.js .rv.in{opacity:1;transform:none}

/* tablets & phones */
@media(max-width:860px){
 .two{grid-template-columns:1fr}
 .burger{display:block;z-index:2}
 .nav nav{position:fixed;inset:0 0 0 30%;background:rgba(5,5,5,.97);flex-direction:column;justify-content:center;padding:2rem;gap:1.6rem;transform:translateX(100%);transition:transform .45s var(--ease);border-left:1px solid var(--line)}
 .nav nav.open{transform:none}.nav nav a{font-size:1.3rem}
 .hero{background-position:center top}   /* keep the top of the banner visible on narrow screens */
}
@media(max-width:520px){.btn{width:100%;text-align:center}.stats{grid-template-columns:1fr}.facts div{flex-direction:column;gap:0}.foot-row{flex-direction:column;align-items:flex-start}.projects{grid-template-columns:1fr}.nav nav{inset:0 0 0 15%}}

/* short landscape screens (phones turned sideways) */
@media(max-height:520px) and (orientation:landscape){
 .hero{min-height:100svh;height:auto}
 .hero-content{padding-top:5rem}
}

/* very large / ultrawide screens */
@media(min-width:2000px){
 html{font-size:20px}
 .hero{background-position:center 30%}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}.js .rv{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="nav" id="nav">
  <a href="index.html" aria-label="DE LA CRUZ home"><img class="logo-img" src="image/logo1.png" alt="DE LA CRUZ logo"></a>
  <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><span></span><span></span></button>
  <nav id="menu" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main id="main">

  <section class="hero" id="home">
    <!-- particles layer: sits above the banner image, below the content -->
    <div id="particles-js" aria-hidden="true"></div>
    <div class="hero-content">
      <!-- your title / text / buttons go here -->
    </div>
  </section>

</main>

<footer class="foot">
  <div class="wrap">
    <p class="foot-big" aria-hidden="true">DE LA CRUZ</p>
    <div class="foot-row">
      <span>Personal digital space</span>
      <ul class="social"><li><a href="#">Facebook</a></li><li><a href="#">Instagram</a></li><li><a href="#">GitHub</a></li><li><a href="#">LinkedIn</a></li></ul>
      <span>© 2026 DE LA CRUZ. All rights reserved.</span>
    </div>
  </div>
  <a href="#home" class="top" id="top" aria-label="Back to top">↑</a>
</footer>

<script>
// DE LA CRUZ — vanilla JS
document.documentElement.classList.add('js');
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const nav=$('#nav'),burger=$('#burger'),menu=$('#menu'),backTop=$('#top');

// navbar: stuck style, hide on scroll down / show on scroll up, back-to-top button
let lastY=scrollY;
const onScroll=()=>{
  const y=scrollY;
  nav.classList.toggle('stuck',y>40);
  backTop.classList.toggle('show',y>700);
  nav.classList.toggle('hide',y>lastY&&y>120&&!menu.classList.contains('open'));
  lastY=y;
};
addEventListener('scroll',onScroll,{passive:true});onScroll();

// mobile menu
const setMenu=o=>{menu.classList.toggle('open',o);burger.setAttribute('aria-expanded',o);burger.setAttribute('aria-label',o?'Close menu':'Open menu')};
burger.addEventListener('click',()=>setMenu(!menu.classList.contains('open')));
menu.addEventListener('click',e=>{if(e.target.tagName==='A')setMenu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});

// scroll reveal
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
$$('.rv').forEach((el,i)=>{el.style.transitionDelay=(i%3)*90+'ms';io.observe(el)});

// active nav link (only in-page anchors)
const links=$$('#menu a'),spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.hash==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
$$('main section[id]').forEach(s=>spy.observe(s));

// contact form UI only runs if the form exists on this page
const contactForm=$('#form');
if(contactForm){
  contactForm.addEventListener('submit',e=>{
    e.preventDefault();
    const s=$('#status');
    if(!contactForm.checkValidity()){contactForm.reportValidity();return}
    s.textContent='Thanks, your message is ready to send. Connect a form service to deliver it.';
    contactForm.reset();
  });
}

// particles background (skipped when the visitor prefers reduced motion)
addEventListener('load',()=>{
  if(typeof particlesJS==='undefined')return;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const mobile=matchMedia('(max-width:860px)').matches;
  particlesJS('particles-js',{
    particles:{
      number:{value:mobile?30:60,density:{enable:true,value_area:800}},
      color:{value:['#78e23a','#78e23a','#54fd3e']},
      shape:{type:'circle'},
      opacity:{value:.55,random:true,anim:{enable:true,speed:.6,opacity_min:.2,sync:false}},
      size:{value:2.5,random:true},
      line_linked:{enable:true,distance:140,color:'#35a620',opacity:.25,width:1},
      move:{enable:true,speed:1.1,direction:'none',random:true,straight:false,out_mode:'out',bounce:false}
    },
    interactivity:{
      detect_on:'window',
      events:{onhover:{enable:!mobile,mode:'grab'},onclick:{enable:true,mode:'push'},resize:true},
      modes:{grab:{distance:160,line_linked:{opacity:.6}},push:{particles_nb:3}}
    },
    retina_detect:true
  });
});
</script>
</body>
</html>
